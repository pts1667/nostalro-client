[package]
name = "ragnarok-ui-component"
version = "0.1.0"
edition = "2024"

[dependencies]
ragnarok-ui = { workspace = true }
ragnarok-resources = { workspace = true }
ragnarok-game = { workspace = true }
ragnarok-ai = { workspace = true }
ragnarok-renderer = { workspace = true }
plugin-ui = { workspace = true }
tracing = { workspace = true }
rust-i18n = { workspace = true }
# preserve_order keeps the server's field order when an entry is shown.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
ragnarok-ui = { workspace = true, features = ["test-support"] }
models = { workspace = true }
ragnarok-formats = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libloading = { workspace = true }
