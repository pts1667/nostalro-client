[package]
name = "ragnarok-client"
version = "0.1.0"
edition = "2024"

[dependencies]
web-time = { workspace = true }
ragnarok-formats = { workspace = true }
ragnarok-resources = { workspace = true }
ragnarok-renderer = { workspace = true }
ragnarok-game = { workspace = true }
ragnarok-ai = { workspace = true }
ragnarok-network = { workspace = true }
ragnarok-profiling = { workspace = true }
ragnarok-ui = { workspace = true }
ragnarok-ui-component = { workspace = true }
ragnarok-audio = { workspace = true }
plugin-ui = { workspace = true }
models = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
winit = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# The web build (`web/build.ps1`): no threads, sockets or files, see `src/web.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Location", "Storage",
    "XmlHttpRequest", "Request", "RequestInit", "Response", "Headers", "console",
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "UrlSearchParams",
] }

[dev-dependencies]
ragnarok-ui = { workspace = true, features = ["test-support"] }

[features]
profiling = ["ragnarok-profiling/profiling", "ragnarok-profiling/puffin"]
