[package]
name = "ragnarok-ui-component-hot"
version = "0.1.0"
edition = "2024"

[lib]
# `rlib` lets `ragnarok-tools` (ui-snapshot) reuse the fixtures through `Scene`.
# The hot-reload host still loads the `cdylib` artifact unchanged.
crate-type = ["cdylib", "rlib"]

[dependencies]
ragnarok-resources = { workspace = true }
models = { workspace = true }
ragnarok-ai = { workspace = true }
ragnarok-ui-component = { workspace = true }
ragnarok-ui = { workspace = true, features = ["test-support"] }
ragnarok-game = { workspace = true }
